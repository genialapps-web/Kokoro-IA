<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Núcleo | Kokoro AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSQw7b4_OJpxZRP8Tu9shvpB4nE-xwmQc",
            authDomain: "smm-proyecto.firebaseapp.com",
            projectId: "smm-proyecto",
            storageBucket: "smm-proyecto.firebasestorage.app",
            messagingSenderId: "696404417299",
            appId: "1:696404417299:web:1c3982babc049a18f398e6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, "usuarios", user.uid), (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        document.getElementById('p-name').innerText = data.username;
                        document.getElementById('p-coins').innerText = data.coins.toLocaleString();
                        document.getElementById('p-status').innerText = data.isPremium ? "PROTOCOLO GOLD" : "USUARIO ESTÁNDAR";
                        document.getElementById('p-status').className = data.isPremium ? "text-yellow-500 font-black italic tracking-widest text-[10px]" : "text-slate-500 font-bold tracking-widest text-[10px]";
                        document.getElementById('p-msg-count').innerText = data.messageCount || "0";
                    }
                });
            } else {
                window.location.href = "auth.html";
            }
        });

        window.cerrarSesion = () => {
            signOut(auth).then(() => window.location.href = "auth.html");
        };
    </script>

    <style>
        body { background: #010206; color: white; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .stat-box { background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%); border: 1px solid rgba(255,255,255,0.03); }
        .premium-glow { box-shadow: 0 0 30px rgba(234, 179, 8, 0.1); border: 1px solid rgba(234, 179, 8, 0.2); }
        .avatar-container { background: conic-gradient(from 180deg at 50% 50%, #eab308 0deg, #78350f 180deg, #eab308 360deg); }
    </style>
</head>
<body class="p-8 pb-32">

    <header class="flex justify-between items-center mb-12 pt-4">
        <button onclick="window.location.href='index.html'" class="w-10 h-10 flex items-center justify-center bg-white/5 rounded-full opacity-60">❮</button>
        <h1 class="text-[9px] font-black uppercase tracking-[0.6em] text-slate-500 italic">Core Digital</h1>
        <div class="w-10"></div>
    </header>

    <div class="flex flex-col items-center mb-12">
        <div class="relative mb-6">
            <div class="w-32 h-32 avatar-container rounded-[3rem] p-1 shadow-2xl">
                <div class="w-full h-full bg-[#010206] rounded-[2.8rem] flex items-center justify-center text-5xl">
                    💫
                </div>
            </div>
            <div class="absolute -bottom-2 -right-2 bg-white text-black text-[9px] font-black px-3 py-1.5 rounded-xl uppercase tracking-tighter shadow-xl">Rank S</div>
        </div>
        <h2 id="p-name" class="text-3xl font-black italic tracking-tighter uppercase">Cargando...</h2>
        <div id="p-status" class="mt-2 px-4 py-1 bg-white/5 rounded-full">Verificando...</div>
    </div>

    <div class="max-w-md mx-auto space-y-5">
        
        <div class="glass-card p-8 rounded-[3rem] flex justify-between items-center premium-glow">
            <div>
                <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-2 italic">Energía Disponible</p>
                <div class="flex items-center gap-3">
                    <span id="p-coins" class="text-3xl font-black text-white tracking-tighter">0</span>
                    <span class="text-lg">💎</span>
                </div>
            </div>
            <button onclick="window.location.href='tienda.html'" class="bg-yellow-500 text-black text-[10px] font-black px-6 py-4 rounded-2xl uppercase tracking-[0.2em] shadow-xl active:scale-95 transition">Recargar</button>
        </div>

        <div class="grid grid-cols-2 gap-5">
            <div class="stat-box p-7 rounded-[2.5rem]">
                <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">Sincronía</p>
                <div class="flex items-baseline gap-1">
                    <span id="p-msg-count" class="text-2xl font-black italic">0</span>
                    <span class="text-[10px] font-bold text-slate-600">MSG</span>
                </div>
                <div class="w-full h-1 bg-white/5 rounded-full mt-4 overflow-hidden">
                    <div class="w-1/3 h-full bg-yellow-500/50"></div>
                </div>
            </div>
            <div class="stat-box p-7 rounded-[2.5rem]">
                <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">Vínculos</p>
                <div class="flex items-baseline gap-1">
                    <span class="text-2xl font-black italic">0</span>
                    <span class="text-[10px] font-bold text-slate-600">REG</span>
                </div>
                <div class="w-full h-1 bg-white/5 rounded-full mt-4 overflow-hidden">
                    <div class="w-1/4 h-full bg-slate-500"></div>
                </div>
            </div>
        </div>

        <div class="glass-card rounded-[2.8rem] overflow-hidden">
            <button class="w-full p-7 text-left border-b border-white/5 flex justify-between items-center active:bg-white/5 transition">
                <div class="flex items-center gap-4">
                    <span class="text-xl">⚙️</span>
                    <span class="text-[11px] font-black uppercase tracking-widest text-slate-300">Ajustes del Sistema</span>
                </div>
                <span class="text-slate-700">❯</span>
            </button>
            <button class="w-full p-7 text-left border-b border-white/5 flex justify-between items-center active:bg-white/5 transition">
                <div class="flex items-center gap-4">
                    <span class="text-xl">📜</span>
                    <span class="text-[11px] font-black uppercase tracking-widest text-slate-300">Registros de Pago</span>
                </div>
                <span class="text-slate-700">❯</span>
            </button>
            <button onclick="cerrarSesion()" class="w-full p-7 text-left flex justify-between items-center active:bg-red-500/5 group transition">
                <div class="flex items-center gap-4">
                    <span class="text-xl group-hover:rotate-12 transition-transform">🚪</span>
                    <span class="text-[11px] font-black uppercase tracking-widest text-red-500">Desconectar Núcleo</span>
                </div>
                <span class="text-red-500 opacity-20">❮</span>
            </button>
        </div>
    </div>

    <nav class="fixed bottom-8 inset-x-8 glass-card rounded-[2.5rem] p-5 flex justify-around items-center z-50 border-white/5 shadow-2xl">
        <button onclick="window.location.href='index.html'" class="text-2xl opacity-30 hover:opacity-100 transition-all">🌌</button>
        <button onclick="window.location.href='tienda.html'" class="text-2xl opacity-30 hover:opacity-100 transition-all">💎</button>
        <button onclick="window.location.href='perfil.html'" class="text-2xl text-yellow-500 drop-shadow-[0_0_8px_rgba(234,179,8,0.5)]">👤</button>
    </nav>

    <footer class="mt-16 text-center">
        <p class="text-[9px] text-slate-700 uppercase font-black tracking-[0.4em] italic">Kokoro Engine v3.1</p>
        <p class="text-[7px] text-slate-800 uppercase font-bold mt-2 tracking-widest">Inspirado en el Multiverso Anime</p>
    </footer>

</body>
</html>
