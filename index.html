<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Santuario AI | Elite Multiverse</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #eab308; --dark-bg: #010206; }
        body { background: var(--dark-bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }

        .glass-premium { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        @keyframes cardEnter {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-card { animation: cardEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .cat-pill-active { background: var(--gold); color: black; box-shadow: 0 0 20px rgba(234, 179, 8, 0.3); }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Efecto premium para historias */
        .story-ring { padding: 2px; background: linear-gradient(135deg, #eab308 0%, #facc15 50%, #ca8a04 100%); }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, getDoc, setDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSQw7b4_OJpxZRP8Tu9shvpB4nE-xwmQc",
            authDomain: "smm-proyecto.firebaseapp.com",
            projectId: "smm-proyecto",
            storageBucket: "smm-proyecto.firebasestorage.app",
            messagingSenderId: "696404417299",
            appId: "1:696404417299:web:1c3982babc049a18f398e6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let personajesData = []; 
        let categoriaActual = 'todos';
        let userUID = null;

        // --- AUTH & PERSISTENCIA INMEDIATA ---
        setPersistence(auth, browserLocalPersistence).then(() => {
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    await signInAnonymously(auth);
                } else {
                    userUID = user.uid;
                    await verificarEInicializarUsuario(user);
                    if (user.isAnonymous) {
                        document.getElementById('guest-banner')?.classList.remove('hidden');
                    }
                    initApp();
                }
            });
        });

        async function verificarEInicializarUsuario(user) {
            const userRef = doc(db, "usuarios", user.uid);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    uid: user.uid,
                    isAnonymous: user.isAnonymous,
                    createdAt: new Date(),
                    freeMessages: 5,
                    coins: 0,
                    isPremium: false
                });
            }
        }

        function initApp() {
            cargarPersonajesFlujoRapido();
            cargarChatsActivos();
        }

        // Optimización de carga reactiva inmediata
        function cargarPersonajesFlujoRapido() {
            const q = query(collection(db, "personajes"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                personajesData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderizarHistorias();
                aplicarFiltros();
            });
        }

        // --- RENDERIZADO DE HISTORIAS (ESTILO EMOCHI) ---
        function renderizarHistorias() {
            const contenedor = document.getElementById('contenedor-historias');
            if(!contenedor) return;
            contenedor.innerHTML = '';
            
            personajesData.slice(0, 6).forEach(ia => {
                contenedor.innerHTML += `
                    <div onclick="window.location.href='chat.html?id=${ia.id}&view=story'" class="flex flex-col items-center flex-shrink-0 cursor-pointer snap-center">
                        <div class="w-16 h-16 rounded-full story-ring p-[2px] mb-1.5 shadow-lg shadow-yellow-500/5">
                            <div class="w-full h-full rounded-full overflow-hidden border-2 border-black bg-slate-900">
                                <img src="${ia.image}" class="w-full h-full object-cover">
                            </div>
                        </div>
                        <span class="text-[9px] font-black tracking-tighter text-white/80 uppercase truncate w-14 text-center">${ia.name}</span>
                    </div>`;
            });
        }

        // --- FILTRADO Y EXPLORACIÓN ---
        window.aplicarFiltros = () => {
            const term = document.getElementById('input-buscador').value.toLowerCase();
            const filtrados = personajesData.filter(ia => {
                const matchesTerm = ia.name.toLowerCase().includes(term) || (ia.personalidad && ia.personalidad.toLowerCase().includes(term));
                const matchesCategory = categoriaActual === 'todos' || (ia.category && ia.category.toLowerCase() === categoriaActual.toLowerCase());
                return matchesTerm && matchesCategory;
            });
            renderizarGridPersonajes(filtrados);
        };

        function renderizarGridPersonajes(lista) {
            const contenedor = document.getElementById('contenedor-ia');
            contenedor.innerHTML = '';
            
            if(lista.length === 0) {
                contenedor.innerHTML = `<div class="col-span-2 text-center text-white/30 text-xs italic py-8">No se encontraron entidades disponibles.</div>`;
                return;
            }

            lista.forEach(ia => {
                contenedor.innerHTML += `
                    <div onclick="window.location.href='chat.html?id=${ia.id}'" class="group relative animate-card cursor-pointer">
                        <div class="w-full aspect-[3/4] rounded-[2.2rem] overflow-hidden border border-white/5 bg-slate-900 relative shadow-2xl">
                            <img src="${ia.image}" class="w-full h-full object-cover opacity-85 group-hover:opacity-100 transition-all duration-300">
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/10 to-transparent"></div>
                            <div class="absolute bottom-4 left-4 right-4">
                                <h4 class="text-xs font-black italic uppercase text-white tracking-tighter leading-none">${ia.name}</h4>
                                <p class="text-[7px] text-yellow-500 font-bold uppercase tracking-widest mt-1">${ia.personalidad || 'Elite'}</p>
                            </div>
                        </div>
                    </div>`;
            });
        }

        window.cambiarCategoria = (cat, element) => {
            categoriaActual = cat;
            document.querySelectorAll('.cat-pill').forEach(btn => {
                btn.classList.remove('cat-pill-active');
                btn.classList.add('bg-white/5', 'text-white/40');
            });
            element.classList.add('cat-pill-active');
            element.classList.remove('bg-white/5', 'text-white/40');
            aplicarFiltros();
        };

        function cargarChatsActivos() {
            if (!userUID) return;
            onSnapshot(collection(db, "usuarios", userUID, "chats"), (snapshot) => {
                const contenedor = document.getElementById('lista-chats-activos');
                if (snapshot.empty) { document.getElementById('seccion-recientes').classList.add('hidden'); return; }
                document.getElementById('seccion-recientes').classList.remove('hidden');
                contenedor.innerHTML = '';
                
                snapshot.forEach(async (d) => {
                    const iaSnap = await getDoc(doc(db, "personajes", d.id));
                    if (iaSnap.exists()) {
                        const ia = iaSnap.data();
                        contenedor.innerHTML += `
                            <div onclick="window.location.href='chat.html?id=${d.id}'" class="flex items-center gap-4 p-3.5 glass-premium rounded-2xl mb-2.5 border border-white/5 cursor-pointer active:scale-[0.99] transition-all">
                                <img src="${ia.image}" class="w-11 h-11 rounded-full object-cover border border-yellow-500/20">
                                <div class="flex-1">
                                    <h4 class="text-[10px] font-black uppercase text-white tracking-wide">${ia.name}</h4>
                                    <p class="text-[7px] text-yellow-500 font-black uppercase tracking-widest mt-0.5">Sincronía Activa</p>
                                </div>
                                <span class="text-xs opacity-40">➤</span>
                            </div>`;
                    }
                });
            });
        }

        // --- SISTEMA DE CREACIÓN ---
        window.crearNuevaEntidad = async () => {
            const name = document.getElementById('c-name').value.trim();
            const physical = document.getElementById('c-physical').value.trim();
            const personality = document.getElementById('c-personality').value.trim();
            
            if(!name || !physical || !personality) return alert("Por favor completa los campos de tu Waifu.");

            try {
                await addDoc(collection(db, "personajes"), {
                    name: name,
                    physicalPrompt: physical,
                    personalidad: personality,
                    description: `Entidad personalizada creada por el multiverso.`,
                    image: "https://i.ibb.co/7C3982b/default.jpg", // Imagen por defecto transitoria
                    category: "anime",
                    createdAt: new Date()
                });
                
                alert("¡Entidad enviada al multiverso con éxito!");
                document.getElementById('c-name').value = '';
                document.getElementById('c-physical').value = '';
                document.getElementById('c-personality').value = '';
                window.toggleModo('home');
            } catch(e) { console.error(e); }
        };

        // NAVEGACIÓN GLOBAL CORREGIDA
        window.toggleModo = (modo) => {
            const sections = ['vista-explorar', 'seccion-crear'];
            const buttons = ['btn-nav-home', 'btn-nav-create'];
            
            sections.forEach(s => document.getElementById(s).classList.add('hidden'));
            buttons.forEach(b => document.getElementById(b)?.classList.add('opacity-30'));

            if(modo === 'home') {
                document.getElementById('vista-explorar').classList.remove('hidden');
                document.getElementById('btn-nav-home').classList.remove('opacity-30');
                aplicarFiltros();
            } else if(modo === 'create') {
                document.getElementById('seccion-crear').classList.remove('hidden');
                document.getElementById('btn-nav-create').classList.remove('opacity-30');
            }
        };

        window.filtrarAlmas = aplicarFiltros;
    </script>
</head>
<body class="p-6 pb-36">

    <div id="vista-explorar" class="space-y-6">
        <header class="flex justify-between items-center pt-2">
            <div>
                <h1 class="text-3xl font-black italic tracking-tighter leading-none uppercase">KOKORO<span class="text-yellow-500">.AI</span></h1>
                <p class="text-[8px] text-slate-500 font-bold uppercase tracking-[0.3em] mt-1">Elite Virtual Companion</p>
            </div>
            <button onclick="window.location.href='perfil.html'" class="w-11 h-11 glass-premium rounded-xl flex items-center justify-center text-lg">👤</button>
        </header>

        <div id="guest-banner" class="hidden bg-yellow-500/10 border border-yellow-500/20 p-4 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-1.5 h-1.5 bg-yellow-500 rounded-full animate-pulse"></div>
                <p class="text-[9px] text-slate-300 font-semibold uppercase tracking-wider">Modo Invitado</p>
            </div>
            <button onclick="window.location.href='auth.html'" class="bg-yellow-500 text-black text-[8px] font-black uppercase px-3 py-1.5 rounded-lg">Registrarme</button>
        </div>

        <div class="space-y-2">
            <h2 class="text-[9px] font-black uppercase text-slate-500 tracking-[0.3em] pl-1 italic">Historias Recientes</h2>
            <div id="contenedor-historias" class="flex gap-4 overflow-x-auto no-scrollbar snap-x snap-mandatory py-1">
                </div>
        </div>

        <div class="relative">
            <input type="text" id="input-buscador" oninput="filtrarAlmas()" placeholder="Buscar por nombre o rasgos..." class="w-full bg-white/5 border border-white/10 p-4.5 pl-6 rounded-full outline-none text-xs italic text-white focus:border-yellow-500/30 transition-all placeholder:text-white/20">
        </div>

        <div id="seccion-recientes" class="hidden space-y-3">
            <h2 class="text-[9px] font-black uppercase text-slate-500 tracking-[0.3em] pl-1 italic">Mensajes</h2>
            <div id="lista-chats-activos"></div>
        </div>

        <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
            <button onclick="cambiarCategoria('todos', this)" class="cat-pill cat-pill-active whitespace-nowrap px-5 py-2.5 rounded-full border border-white/5 text-[8px] font-black uppercase tracking-wider transition-all">Todos</button>
            <button onclick="cambiarCategoria('anime', this)" class="cat-pill whitespace-nowrap px-5 py-2.5 rounded-full border border-white/5 bg-white/5 text-white/40 text-[8px] font-black uppercase tracking-wider transition-all">🌸 Anime</button>
        </div>

        <div id="contenedor-ia" class="grid grid-cols-2 gap-4 pt-2"></div>
    </div>

    <div id="seccion-crear" class="hidden pt-2 max-w-md mx-auto space-y-6">
        <div class="text-center">
            <h2 class="text-2xl font-black italic uppercase tracking-tighter">Crear <span class="text-yellow-500">Waifu</span></h2>
            <p class="text-[8px] text-slate-500 font-bold uppercase tracking-[0.3em] mt-1">Materializa una nueva entidad</p>
        </div>
        <div class="glass-premium p-6 rounded-[2.5rem] border border-white/10 space-y-4">
             <div>
                 <label class="text-[8px] font-black uppercase tracking-widest text-slate-400 block mb-2 pl-1">Identidad</label>
                 <input type="text" id="c-name" placeholder="Nombre de la Waifu..." class="w-full bg-black/40 border border-white/10 p-4 rounded-xl text-xs text-white placeholder:text-white/20 outline-none focus:border-yellow-500/30 transition-all">
             </div>
             <div>
                 <label class="text-[8px] font-black uppercase tracking-widest text-slate-400 block mb-2 pl-1">Arquetipo Psicológico</label>
                 <input type="text" id="c-personality" placeholder="Ej: Tsundere, coqueta, tímida..." class="w-full bg-black/40 border border-white/10 p-4 rounded-xl text-xs text-white placeholder:text-white/20 outline-none focus:border-yellow-500/30 transition-all">
             </div>
             <div>
                 <label class="text-[8px] font-black uppercase tracking-widest text-slate-400 block mb-2 pl-1">Rasgos Físicos (DALL-E Prompt)</label>
                 <textarea id="c-physical" placeholder="Cabello blanco, ojos carmesí, estética cyberpunk..." class="w-full bg-black/40 border border-white/10 p-4 rounded-xl h-24 text-xs text-white placeholder:text-white/20 outline-none focus:border-yellow-500/30 transition-all resize-none"></textarea>
             </div>
             <button onclick="crearNuevaEntidad()" class="w-full bg-yellow-500 text-black font-black py-4 rounded-xl uppercase text-[10px] tracking-widest shadow-xl shadow-yellow-500/10 active:scale-[0.98] transition-all mt-2">Inspirar Entidad</button>
        </div>
    </div>

    <nav class="fixed bottom-8 inset-x-6 glass-premium rounded-[2.5rem] p-5 flex justify-around items-center z-[100] border border-white/10 shadow-2xl">
        <button id="btn-nav-home" onclick="toggleModo('home')" class="text-xl text-yellow-500 transition-all duration-300 transform">🌌</button>
        <button id="btn-nav-create" onclick="toggleModo('create')" class="text-xl opacity-30 transition-all duration-300 transform">✨</button>
        <button onclick="window.location.href='tienda.html'" class="text-xl opacity-30">💎</button>
    </nav>

</body>
</html>
