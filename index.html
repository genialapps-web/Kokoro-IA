<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokoro AI | Multiverso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSQw7b4_OJpxZRP8Tu9shvpB4nE-xwmQc",
            authDomain: "smm-proyecto.firebaseapp.com",
            projectId: "smm-proyecto",
            storageBucket: "smm-proyecto.firebasestorage.app",
            messagingSenderId: "696404417299",
            appId: "1:696404417299:web:1c3982babc049a18f398e6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userUID = null;
        let isAnon = false;
        let systemPrompt = "";
        let personajeId = null;

        // Obtener el ID del personaje desde la URL
        const urlParams = new URLSearchParams(window.location.search);
        personajeId = urlParams.get('id');

        // Autenticación silenciosa al cargar la página
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userUID = user.uid;
                isAnon = user.isAnonymous;
                await asegurarDocumentoUsuario(user);
                
                if (personajeId) {
                    await cargarDatosPersonaje();
                    inicializarEscuchaMensajes();
                }
            } else {
                try {
                    const userCredential = await signInAnonymously(auth);
                    userUID = userCredential.user.uid;
                    isAnon = userCredential.user.isAnonymous;
                    await asegurarDocumentoUsuario(userCredential.user);

                    if (personajeId) {
                        await cargarDatosPersonaje();
                        inicializarEscuchaMensajes();
                    }
                } catch (e) {
                    console.error("Error al iniciar sesión anónima:", e);
                }
            }
        });

        // Crear/Verificar documento del usuario en la base de datos
        async function asegurarDocumentoUsuario(user) {
            try {
                const userRef = doc(db, "usuarios", user.uid);
                await setDoc(userRef, {
                    username: user.displayName || "Explorador",
                    coins: 1500,
                    isPremium: false,
                    esInvitado: true,
                    createdAt: serverTimestamp()
                }, { merge: true });
            } catch (e) {
                console.error("Error al asegurar el documento del usuario:", e);
            }
        }

        // Cargar datos del personaje
        async function cargarDatosPersonaje() {
            try {
                if (!personajeId) return;
                const docRef = doc(db, "personajes", personajeId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const nameEl = document.getElementById('ia-name');
                    if (nameEl) nameEl.innerText = data.name || "Kokoro AI";
                    
                    const imgElement = document.getElementById('chat-avatar');
                    if (imgElement) imgElement.src = data.image || "";
                    
                    systemPrompt = data.physicalPrompt || data.description || "Eres una entidad del multiverso.";
                }
            } catch (e) {
                console.error("Error al cargar datos del personaje:", e);
            }
        }

        // Enviar mensaje
        window.enviarMensaje = async () => {
            const inputField = document.getElementById('chat-input');
            const mensajeTexto = inputField.value.trim();

            if (!mensajeTexto) return;

            // Control de límite para invitados
            if (isAnon) {
                let mensajesInvitado = parseInt(localStorage.getItem('mensajes_invitado') || '0');
                if (mensajesInvitado >= 3) {
                    alert("Has alcanzado el límite de mensajes como invitado. ¡Registra una cuenta para continuar tu historia!");
                    window.location.href = 'auth.html';
                    return;
                }
                localStorage.setItem('mensajes_invitado', mensajesInvitado + 1);
            }

            try {
                const payload = {
                    texto: mensajeTexto,
                    remitente: "usuario",
                    timestamp: serverTimestamp()
                };

                await addDoc(collection(db, "usuarios", userUID, "chats", personajeId, "mensajes"), payload);
                inputField.value = "";
            } catch (e) {
                alert("Error al enviar el mensaje: " + e.message);
            }
        };

        // Escuchar mensajes
        function inicializarEscuchaMensajes() {
            if (!userUID || !personajeId) return;

            const q = query(
                collection(db, "usuarios", userUID, "chats", personajeId, "mensajes"), 
                orderBy("timestamp", "asc")
            );

            onSnapshot(q, (snapshot) => {
                const chatContainer = document.getElementById('chat-container');
                if (!chatContainer) return;
                
                chatContainer.innerHTML = "";
                
                if (snapshot.empty) {
                    chatContainer.innerHTML = `<p class="text-center text-slate-500 text-[10px] uppercase mt-6">Escribe un mensaje para iniciar la conversación</p>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const esUsuario = data.remitente === "usuario";

                    chatContainer.innerHTML += `
                        <div class="flex ${esUsuario ? 'justify-end' : 'justify-start'} mb-4 animate-card">
                            <div class="max-w-[75%] p-4 rounded-2xl text-xs ${
                                esUsuario 
                                ? 'bg-yellow-500 text-black font-semibold' 
                                : 'glass-premium border border-white/5 text-white'
                            }">
                                <p>${data.texto}</p>
                            </div>
                        </div>
                    `;
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }
    </script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top, #0a0c14 0%, #010206 100%);
        }
        .input-focus:focus { border-color: #eab308; box-shadow: 0 0 15px rgba(234, 179, 8, 0.1); }
        .glass-card { 
            background: rgba(255, 255, 255, 0.01); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .glass-premium {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
        }
        .text-glow { text-shadow: 0 0 10px rgba(234, 179, 8, 0.3); }
    </style>
</head>
<body class="text-white h-screen flex flex-col items-center justify-between p-8">

    <div class="w-full max-w-2xl text-center mt-4">
        <h1 class="text-4xl font-black italic tracking-tighter mb-1 uppercase">KOKORO<span class="text-yellow-500 text-glow">.AI</span></h1>
        <p class="text-slate-500 text-[9px] uppercase tracking-[0.5em] font-bold opacity-70">Tu Novia Virtual Multiverso</p>
    </div>

    <div class="w-full max-w-2xl glass-card p-6 rounded-[2.5rem] flex flex-col h-[60vh] justify-between">
        <div class="flex items-center space-x-4 mb-4">
            <img id="chat-avatar" src="" alt="Avatar" class="w-12 h-12 rounded-full object-cover border-2 border-yellow-500/30">
            <div>
                <h2 id="ia-name" class="font-bold text-sm tracking-tight">Cargando personaje...</h2>
                <span class="text-[9px] uppercase text-green-500 tracking-wider">Conexión Segura</span>
            </div>
        </div>

        <div id="chat-container" class="flex-1 overflow-y-auto pr-2 space-y-2 mb-4 text-xs">
            </div>

        <div class="flex items-center space-x-3 bg-black/40 border border-white/5 p-2 rounded-2xl">
            <input type="text" id="chat-input" placeholder="Escribe un mensaje..." class="flex-1 bg-transparent p-3 outline-none text-sm placeholder:opacity-30">
            <button onclick="enviarMensaje()" class="bg-yellow-500 text-black p-3 rounded-xl font-bold text-xs uppercase tracking-wider active:scale-95 transition-all">
                Enviar
            </button>
        </div>
    </div>

    <div class="mb-4 flex items-center space-x-2 opacity-30">
        <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
        <p class="text-[8px] uppercase font-black tracking-[0.3em]">Conexión Encriptada Kokoro Secure</p>
    </div>

</body>
</html>
