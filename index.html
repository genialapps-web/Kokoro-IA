<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Santuario AI | Elite Multiverse</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #eab308; --dark-bg: #010206; }
        body { background: var(--dark-bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }

        .glass-premium { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        @keyframes cardEnter {
            0% { opacity: 0; transform: scale(0.9) translateY(40px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-card { animation: cardEnter 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards; }

        .dating-card { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); transition: transform 0.4s ease-out, opacity 0.3s ease; touch-action: none; }
        .cat-pill-active { background: var(--gold); color: black; box-shadow: 0 0 20px rgba(234, 179, 8, 0.3); }

        .heart-btn { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); box-shadow: 0 10px 25px rgba(234, 179, 8, 0.4); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, getDoc, setDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSQw7b4_OJpxZRP8Tu9shvpB4nE-xwmQc",
            authDomain: "smm-proyecto.firebaseapp.com",
            projectId: "smm-proyecto",
            storageBucket: "smm-proyecto.firebasestorage.app",
            messagingSenderId: "696404417299",
            appId: "1:696404417299:web:1c3982babc049a18f398e6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let personajesData = []; 
        let categoriaActual = 'todos';
        let userUID = null;
        let datingIndex = 0;
        let startX = 0;
        let currentX = 0;

        // --- AUTH & PERSISTENCIA ---
        setPersistence(auth, browserLocalPersistence).then(() => {
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    await signInAnonymously(auth);
                } else {
                    userUID = user.uid;
                    await inicializarPerfilUsuario(user);
                    if (user.isAnonymous) {
                        document.getElementById('guest-banner')?.classList.remove('hidden');
                    }
                    initApp();
                }
            });
        });

        async function inicializarPerfilUsuario(user) {
            const userRef = doc(db, "usuarios", user.uid);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    uid: user.uid,
                    isAnonymous: user.isAnonymous,
                    createdAt: new Date(),
                    chances: 10, // Más margen para invitados
                    lastLogin: new Date()
                });
            }
        }

        function initApp() {
            escucharPersonajes();
            cargarChatsActivos();
        }

        function escucharPersonajes() {
            const q = query(collection(db, "personajes"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                personajesData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderizarPantallaActual();
            });
        }

        function renderizarPantallaActual() {
            if (!document.getElementById('seccion-dating').classList.contains('hidden')) renderDatingCard();
            else aplicarFiltros();
        }

        // --- NAVEGACIÓN GLOBAL ---
        window.toggleModo = (modo) => {
            const sections = ['vista-explorar', 'seccion-dating', 'seccion-crear'];
            const buttons = ['btn-nav-home', 'btn-nav-dating', 'btn-nav-create'];
            
            sections.forEach(s => document.getElementById(s).classList.add('hidden'));
            buttons.forEach(b => {
                const btn = document.getElementById(b);
                if(btn) { btn.classList.add('opacity-30'); btn.classList.remove('text-yellow-500', 'scale-110'); }
            });

            if(modo === 'home') {
                document.getElementById('vista-explorar').classList.remove('hidden');
                document.getElementById('btn-nav-home').classList.add('text-yellow-500', 'scale-110');
                document.getElementById('btn-nav-home').classList.remove('opacity-30');
                aplicarFiltros();
            } else if(modo === 'dating') {
                document.getElementById('seccion-dating').classList.remove('hidden');
                document.getElementById('btn-nav-dating').classList.add('text-yellow-500', 'scale-110');
                document.getElementById('btn-nav-dating').classList.remove('opacity-30');
                renderDatingCard();
            } else if(modo === 'create') {
                document.getElementById('seccion-crear').classList.remove('hidden');
                document.getElementById('btn-nav-create').classList.add('text-yellow-500', 'scale-110');
                document.getElementById('btn-nav-create').classList.remove('opacity-30');
            }
        };

        // --- EXPLORAR & FILTROS ---
        window.aplicarFiltros = () => {
            const term = document.getElementById('input-buscador').value.toLowerCase();
            const filtrados = personajesData.filter(ia => {
                const matchesTerm = ia.name.toLowerCase().includes(term) || (ia.personalidad && ia.personalidad.toLowerCase().includes(term));
                const matchesCategory = categoriaActual === 'todos' || (ia.category && ia.category.toLowerCase() === categoriaActual.toLowerCase());
                return matchesTerm && matchesCategory;
            });
            renderizarLista(filtrados);
        };

        function renderizarLista(lista) {
            const contenedor = document.getElementById('contenedor-ia');
            contenedor.innerHTML = '';
            lista.forEach(ia => {
                contenedor.innerHTML += `
                    <div onclick="window.location.href='chat.html?id=${ia.id}'" class="group relative animate-card cursor-pointer">
                        <div class="w-full aspect-[3/4] rounded-[2.5rem] overflow-hidden border border-white/5 bg-slate-900 relative">
                            <img src="${ia.image}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-all duration-500">
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
                            <div class="absolute bottom-4 left-5 right-5">
                                <h4 class="text-sm font-black italic uppercase text-white tracking-tighter">${ia.name}</h4>
                                <p class="text-[7px] text-yellow-500 font-bold uppercase tracking-widest mt-1">${ia.personalidad || 'Elite'}</p>
                            </div>
                        </div>
                    </div>`;
            });
        }

        window.cambiarCategoria = (cat, element) => {
            categoriaActual = cat;
            document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('cat-pill-active'));
            element.classList.add('cat-pill-active');
            aplicarFiltros();
        };

        // --- DATING ENGINE ---
        window.renderDatingCard = () => {
            const container = document.getElementById('dating-card-container');
            if (personajesData.length === 0) return;
            const ia = personajesData[datingIndex % personajesData.length];

            container.innerHTML = `
                <div id="active-card" class="dating-card relative w-full max-w-[380px] h-[620px] rounded-[3.5rem] overflow-hidden border border-white/10 animate-card bg-slate-900">
                    <img src="${ia.image}" class="w-full h-full object-cover pointer-events-none">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div>
                    <div class="absolute bottom-0 left-0 right-0 p-8 pb-10">
                        <h3 class="text-4xl font-black text-white italic tracking-tighter uppercase mb-3">${ia.name}</h3>
                        <p class="text-white/60 text-xs font-medium mb-8 line-clamp-2">"${ia.description}"</p>
                        <div class="flex items-center justify-around gap-4">
                            <button onclick="nextDating(false)" class="w-16 h-16 rounded-full glass-premium flex items-center justify-center text-2xl active:scale-90 transition-all">✕</button>
                            <button onclick="window.location.href='chat.html?id=${ia.id}'" class="heart-btn w-20 h-20 rounded-full flex items-center justify-center text-3xl active:scale-95 transition-all">❤️</button>
                            <button onclick="nextDating(true)" class="w-16 h-16 rounded-full glass-premium flex items-center justify-center text-2xl text-yellow-500 active:scale-90 transition-all">⭐</button>
                        </div>
                    </div>
                </div>`;
        };

        window.nextDating = (liked) => {
            datingIndex++;
            renderDatingCard();
        };

        function cargarChatsActivos() {
            if (!userUID) return;
            onSnapshot(collection(db, "usuarios", userUID, "chats"), (snapshot) => {
                const contenedor = document.getElementById('lista-chats-activos');
                if (snapshot.empty) { document.getElementById('seccion-recientes').classList.add('hidden'); return; }
                document.getElementById('seccion-recientes').classList.remove('hidden');
                contenedor.innerHTML = '';
                snapshot.forEach(async (d) => {
                    const iaSnap = await getDoc(doc(db, "personajes", d.id));
                    if (iaSnap.exists()) {
                        const ia = iaSnap.data();
                        contenedor.innerHTML += `
                            <div onclick="window.location.href='chat.html?id=${d.id}'" class="flex items-center gap-4 p-4 glass-premium rounded-[2rem] mb-3 border border-white/5 cursor-pointer">
                                <img src="${ia.image}" class="w-12 h-12 rounded-full object-cover border border-yellow-500/20">
                                <div class="flex-1"><h4 class="text-xs font-black uppercase text-white">${ia.name}</h4><p class="text-[8px] text-yellow-500 font-bold uppercase">Activa</p></div>
                            </div>`;
                    }
                });
            });
        }
        
        // Exponer funciones necesarias al HTML
        window.filtrarAlmas = aplicarFiltros;
    </script>
</head>
<body class="p-6 pb-40">

    <div id="vista-explorar">
        <header class="flex justify-between items-center mb-8 pt-4">
            <div>
                <h1 class="text-3xl font-black italic tracking-tighter leading-none uppercase">KOKORO<span class="text-yellow-500">.AI</span></h1>
                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-[0.3em] mt-1">Elite Virtual Companion</p>
            </div>
            <button onclick="window.location.href='perfil.html'" class="w-12 h-12 glass-premium rounded-2xl flex items-center justify-center text-xl cursor-pointer">👤</button>
        </header>

        <div id="guest-banner" class="hidden bg-yellow-500/10 border border-yellow-500/30 p-4 rounded-3xl mb-8 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></div>
                <p class="text-[9px] text-slate-300 font-medium">Modo Invitado: Registrate para guardar memoria infinita.</p>
            </div>
            <button onclick="window.location.href='auth.html'" class="bg-yellow-500 text-black text-[8px] font-black uppercase px-3 py-2 rounded-xl">Unirme</button>
        </div>

        <div class="relative mb-8">
            <input type="text" id="input-buscador" oninput="filtrarAlmas()" placeholder="Buscar por nombre o personalidad..." class="w-full bg-white/5 border border-white/10 p-5 rounded-full outline-none text-xs italic text-white focus:border-yellow-500/40">
        </div>

        <div id="seccion-recientes" class="mb-10 hidden">
            <h2 class="text-[10px] font-black uppercase text-slate-500 tracking-[0.4em] mb-4 pl-2 italic">Conversaciones</h2>
            <div id="lista-chats-activos"></div>
        </div>

        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-8">
            <button onclick="cambiarCategoria('todos', this)" class="cat-pill cat-pill-active whitespace-nowrap px-6 py-3 rounded-full border border-white/10 text-[9px] font-black uppercase tracking-wider">Todos</button>
            <button onclick="cambiarCategoria('anime', this)" class="cat-pill whitespace-nowrap px-6 py-3 rounded-full border border-white/10 bg-white/5 text-white/40 text-[9px] font-black uppercase tracking-wider">🌸 Anime</button>
        </div>

        <div id="contenedor-ia" class="grid grid-cols-2 gap-4"></div>
    </div>

    <div id="seccion-dating" class="hidden min-h-[70vh] flex flex-col items-center justify-center pt-4">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-black italic uppercase tracking-tighter">Santuario <span class="text-yellow-500">Match</span></h2>
            <p class="text-[9px] text-slate-500 font-bold uppercase tracking-[0.3em]">Encuentra tu alma gemela</p>
        </div>
        <div id="dating-card-container" class="w-full flex justify-center px-4"></div>
    </div>

    <div id="seccion-crear" class="hidden pt-4 max-w-lg mx-auto">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-black italic uppercase tracking-tighter">Crear <span class="text-yellow-500">Waifu</span></h2>
            <p class="text-[9px] text-slate-500 font-bold uppercase tracking-[0.3em]">Materializa una nueva entidad</p>
        </div>
        <div class="glass-premium p-6 rounded-[2.5rem] border border-white/10 space-y-4">
             <input type="text" id="c-name" placeholder="Nombre" class="w-full bg-black/40 border border-white/10 p-4 rounded-2xl text-xs text-white">
             <textarea id="c-physical" placeholder="Apariencia (DALL-E Prompt)" class="w-full bg-black/40 border border-yellow-500/20 p-4 rounded-2xl h-24 text-xs text-white"></textarea>
             <button class="w-full bg-yellow-500 text-black font-black py-4 rounded-2xl uppercase text-xs">Crear Ahora</button>
        </div>
    </div>

    <nav class="fixed bottom-10 inset-x-8 glass-premium rounded-[3rem] p-6 flex justify-around items-center z-[100] border border-white/10">
        <button id="btn-nav-home" onclick="toggleModo('home')" class="text-2xl text-yellow-500 transition-all duration-300 scale-110">🌌</button>
        <button id="btn-nav-dating" onclick="toggleModo('dating')" class="text-2xl opacity-30 transition-all duration-300">🔥</button>
        <button id="btn-nav-create" onclick="toggleModo('create')" class="text-2xl opacity-30 transition-all duration-300">✨</button>
        <button onclick="window.location.href='tienda.html'" class="text-2xl opacity-30">💎</button>
    </nav>

</body>
</html>
