<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sincronía | Kokoro AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background: #000; 
            color: white; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
        }
        .glass-premium { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-header { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); height: 70px; flex-shrink: 0; }
        .chat-container { flex: 1; overflow-y: auto; background-size: cover; background-position: center; }
        ::-webkit-scrollbar { display: none; }
        
        .barra-afinidad { width: 60px; height: 4px; background: rgba(255,255,255,0.1); rounded: 2px; overflow: hidden; }
        .barra-fill { height: 100%; width: 10%; background: #eab308; transition: width 0.5s ease; box-shadow: 0 0 10px #eab308; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.3s ease forwards; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, limit, updateDoc, increment, setDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSQw7b4_OJpxZRP8Tu9shvpB4nE-xwmQc",
            authDomain: "smm-proyecto.firebaseapp.com",
            projectId: "smm-proyecto",
            storageBucket: "smm-proyecto.firebasestorage.app",
            messagingSenderId: "696404417299",
            appId: "1:696404417299:web:1c3982babc049a18f398e6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Clave de respaldo si no se encuentra en la base de datos
        const OPENAI_KEY = ""; 

        async function getOpenAiKey() {
            try {
                const docSnap = await getDoc(doc(db, "config", "openai"));
                if (docSnap.exists() && docSnap.data().key) {
                    return docSnap.data().key;
                }
            } catch (e) {
                console.error("Error al obtener la API Key de Firebase", e);
            }
            return OPENAI_KEY;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const characterId = urlParams.get('id');

        let userUID = null;
        let personajeData = null;
        let unsubscribeChat = null;
        let unsubscribeUser = null;
        let isTyping = false;

        onAuthStateChanged(auth, async (user) => {
            if (user) { 
                userUID = user.uid; 
                await inicializarUsuarioSiNoExiste(user);
                cargarPersonaje();
                escucharAfinidad(); 
                escucharDatosUsuario();
            } else {
                window.location.href = 'auth.html';
            }
        });

        async function inicializarUsuarioSiNoExiste(user) {
            const userRef = doc(db, "usuarios", user.uid);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    uid: user.uid,
                    isAnonymous: user.isAnonymous,
                    createdAt: new Date(),
                    freeMessages: 5, 
                    coins: 0,
                    isPremium: false,
                    chats: []
                });
            }
        }

        function escucharDatosUsuario() {
            if (!userUID) return;
            if (unsubscribeUser) unsubscribeUser();

            unsubscribeUser = onSnapshot(doc(db, "usuarios", userUID), (docSnap) => {
                if (docSnap.exists()) {
                    const uData = docSnap.data();
                    const freeMsgCounter = document.getElementById('free-msg-counter');
                    const coinCounter = document.getElementById('coin-counter');

                    if (uData.isPremium) {
                        freeMsgCounter.innerText = "∞";
                        coinCounter.innerText = "💎 ∞";
                    } else {
                        freeMsgCounter.innerText = (uData.freeMessages || 0) + " Libres";
                        coinCounter.innerText = "💎 " + (uData.coins || 0);
                    }
                }
            });
        }

        async function cargarPersonaje() {
            if (!characterId) return;
            const docRef = doc(db, "personajes", characterId);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                personajeData = docSnap.data();
                document.getElementById('ia-name').innerText = personajeData.name;
                document.getElementById('ia-img').src = personajeData.image;
                
                const chatBox = document.getElementById('chat-box');
                chatBox.style.backgroundImage = `linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.85)), url('${personajeData.image}')`;
                escucharMensajes();
            }
        }

        function escucharAfinidad() {
            if (!userUID || !characterId) return;
            onSnapshot(doc(db, "usuarios", userUID, "chats", characterId), (docSnap) => {
                if (docSnap.exists()) {
                    const afinidad = docSnap.data().afinidad || 0;
                    document.getElementById('afinidad-bar').style.width = Math.min(afinidad, 100) + "%";
                }
            });
        }

        function escucharMensajes() {
            if (!userUID || !characterId) return;
            if (unsubscribeChat) unsubscribeChat();

            const q = query(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), orderBy("createdAt", "asc"), limit(50));
            
            unsubscribeChat = onSnapshot(q, (snapshot) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snapshot.forEach(docSnap => { 
                    const data = docSnap.data();
                    if(data.createdAt) {
                        box.innerHTML += generarHTMLMensaje(data); 
                    }
                });
                box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
            });
        }

        function generarHTMLMensaje(m) {
            const isUser = m.role === 'user';
            const isGift = m.type === 'gift';
            
            if (isGift) {
                return `
                <div class="flex justify-center my-3 animate-fadeIn">
                    <div class="bg-gradient-to-tr from-yellow-400 to-amber-600 p-[1px] rounded-xl shadow-lg shadow-yellow-500/20">
                        <div class="bg-black/80 backdrop-blur-xl px-3 py-2 rounded-xl text-center">
                            <span class="text-2xl block mb-0.5">${m.icon}</span>
                            <p class="text-[7px] font-black uppercase tracking-tighter text-yellow-500">Regalaste ${m.content}</p>
                        </div>
                    </div>
                </div>`;
            }

            if (m.type === 'image') {
                return `
                <div class="flex justify-start mb-2 animate-fadeIn px-2">
                    <div class="bg-white/10 p-1 rounded-lg border border-white/10 backdrop-blur-md shadow-md max-w-[75%]">
                        <img src="${m.content}" class="rounded-md w-full h-auto object-cover border border-white/5 shadow-2xl">
                        <p class="text-[7px] text-yellow-500 font-bold uppercase mt-1 text-center tracking-widest">Foto generada (100💎)</p>
                    </div>
                </div>`;
            }

            return `
                <div class="flex ${isUser ? 'justify-end' : 'justify-start'} mb-2 animate-fadeIn px-2">
                    <div class="relative ${isUser ? 'bg-yellow-500 text-black rounded-lg rounded-tr-sm font-semibold' : 'bg-white/10 text-white backdrop-blur-md border border-white/10 rounded-lg rounded-tl-sm'} px-3 py-2 max-w-[75%] shadow-md">
                        <p class="text-[12px] leading-snug">${m.content}</p>
                    </div>
                </div>`;
        }

        window.enviarMensaje = async () => {
            if (isTyping) return;

            const userRef = doc(db, "usuarios", userUID);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) return;

            const uData = userSnap.data();

            if (!uData.isPremium) {
                const freeMsgs = uData.freeMessages || 0;
                const coins = uData.coins || 0;

                if (freeMsgs === 0 && coins === 0) {
                    window.mostrarModalAnuncio();
                    return;
                }
            }

            const input = document.getElementById('msg-input');
            const msg = input.value.trim();
            if (!msg || !userUID || !characterId) return;

            try {
                await runTransaction(db, async (transaction) => {
                    const transUserSnap = await transaction.get(userRef);
                    const transUserData = transUserSnap.data();

                    if (!transUserData.isPremium) {
                        const transFreeMsgs = transUserData.freeMessages || 0;
                        const transCoins = transUserData.coins || 0;

                        if (transFreeMsgs > 0) {
                            transaction.update(userRef, { freeMessages: transFreeMsgs - 1 });
                        } else if (transCoins >= 1) {
                            transaction.update(userRef, { coins: transCoins - 1 });
                        } else {
                            throw new Error("¡No tienes mensajes gratuitos ni diamantes!");
                        }
                    }
                });
            } catch (error) {
                window.mostrarModalAnuncio();
                return;
            }

            input.value = '';

            try {
                const msgPath = collection(db, "usuarios", userUID, "chats", characterId, "mensajes");
                await addDoc(msgPath, { role: 'user', content: msg, createdAt: new Date() });
                
                // Actualizar lista global de chats activos del usuario para index.html
                await setDoc(doc(db, "usuarios", userUID, "chats", characterId), { id: characterId, lastUpdate: new Date() }, { merge: true });
                
                procesarRespuestaIA(msg);
            } catch (e) { console.error(e); }
        };

        async function procesarRespuestaIA(userContent) {
            isTyping = true;
            document.getElementById('typing').classList.remove('hidden');

            try {
                const currentApiKey = await getOpenAiKey();

                const moodResponse = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${currentApiKey}` },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: "Analiza el sentimiento del usuario. Responde SOLO con una palabra: CARIÑOSO, GROSERO o NEUTRAL." },
                            { role: "user", content: userContent }
                        ]
                    })
                });
                const moodData = await moodResponse.json();
                const mood = moodData.choices[0]?.message?.content || "NEUTRAL";

                let moodPrompt = "";
                if (mood.includes("GROSERO")) moodPrompt = "Estás un poco molesta o digna, responde de forma más fría.";
                if (mood.includes("CARIÑOSO")) moodPrompt = "Estás muy feliz, mimada y afectuosa, usa emojis tiernos.";

                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${currentApiKey}` },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { 
                                role: "system", 
                                content: `Eres ${personajeData.name}. Descripción: ${personajeData.description}. Personalidad: ${personajeData.personalidad}. ${moodPrompt} Responde de manera corta, fluida, coqueta y ultra envolvente. REGLA CRÍTICA: Si el usuario te pide explícitamente una foto, imagen, o te pregunta qué llevas puesto/qué haces, incluye obligatoriamente al final de tu respuesta de texto exactamente esta etiqueta: [GENERA_IMAGEN: pose o acción descrita de forma sensual o estética].` 
                            },
                            { role: "user", content: userContent }
                        ]
                    })
                });

                const data = await response.json();
                let aiReply = data.choices[0].message.content;
                
                if (aiReply.includes("[GENERA_IMAGEN:")) {
                    const accionVisual = aiReply.match(/\[GENERA_IMAGEN: (.*?)\]/)[1];
                    aiReply = aiReply.replace(/\[GENERA_IMAGEN:.*?\]/, ""); 
                    await generarImagenIA(accionVisual);
                }

                await addDoc(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), { 
                    role: 'assistant', content: aiReply, createdAt: new Date() 
                });

                await setDoc(doc(db, "usuarios", userUID, "chats", characterId), { afinidad: increment(1) }, { merge: true });

            } catch (e) { 
                console.error(e); 
            } finally {
                isTyping = false;
                document.getElementById('typing').classList.add('hidden');
            }
        }

        async function generarImagenIA(accionPrompt) {
            const costo = 100;
            const userRef = doc(db, "usuarios", userUID);
            const userSnap = await getDoc(userRef);
            
            if ((userSnap.data().coins || 0) < costo) {
                await addDoc(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), { 
                    role: 'assistant', content: "Cariño, me encantaría mandarte una foto pero necesitas 100 diamantes. ¡Recarga en el Bazar para verme! ✨", createdAt: new Date() 
                });
                return;
            }

            try {
                await updateDoc(userRef, { coins: increment(-costo) });
                const currentApiKey = await getOpenAiKey();
                const masterLook = personajeData.physicalPrompt || "Anime girl, boutique aesthetic, high quality";

                const imgResponse = await fetch("https://api.openai.com/v1/images/generations", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${currentApiKey}` },
                    body: JSON.stringify({
                        model: "dall-e-3",
                        prompt: `Masterpiece, aesthetic anime illustrations. Luxurious colors, 8k resolution. Character description: ${masterLook}. Current action: ${accionPrompt}. Elegant dynamic composition.`,
                        n: 1,
                        size: "1024x1792"
                    })
                });

                const imgData = await imgResponse.json();
                const url = imgData.data[0].url;

                await addDoc(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), { 
                    role: 'assistant', type: 'image', content: url, createdAt: new Date() 
                });
            } catch (err) { console.error(err); }
        }

        window.enviarRegalo = async (nombre, icon, costo) => {
            if (!userUID) return;
            const userRef = doc(db, "usuarios", userUID);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists() || (userSnap.data().coins || 0) < costo) {
                alert("Diamantes insuficientes en tu cuenta.");
                return;
            }

            await updateDoc(userRef, { coins: increment(-costo) });
            await addDoc(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), { 
                role: 'user', type: 'gift', icon: icon, content: nombre, createdAt: new Date() 
            });

            window.toggleRegalos();
            procesarRespuestaIA(`[Te acabo de enviar un regalo especial: ${nombre} ${icon}]`);
        };

        window.mostrarModalAnuncio = () => document.getElementById('ad-modal').classList.remove('hidden');
        window.cerrarModalAnuncio = () => document.getElementById('ad-modal').classList.add('hidden');
        window.irAlBazar = () => window.location.href = 'bazar.html';
        window.toggleRegalos = () => document.getElementById('gift-menu').classList.toggle('hidden');
        
        // Manejo del Enter en teclado
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('msg-input').addEventListener('keydown', (e) => {
                if(e.key === 'Enter') window.enviarMensaje();
            });
        });
    </script>
</head>
<body>

    <div id="ad-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-[200] flex items-center justify-center p-6">
        <div class="glass-premium w-full max-w-xs p-6 rounded-[2.5rem] text-center border border-white/10 animate-card">
            <div class="flex justify-center mb-4">
                <div class="bg-black p-3.5 rounded-full border border-yellow-500/20">
                    <span class="text-xl">📺</span>
                </div>
            </div>
            <h3 class="text-[11px] font-black text-yellow-500 uppercase tracking-widest mb-1.5">Santuario Vacío</h3>
            <p class="text-[9px] text-white/50 max-w-[230px] mx-auto mb-6 leading-relaxed">
                Has agotado tus transmisiones libres. Ve al Bazar para conseguir energía o Diamantes Elite.
            </p>
            <div id="ad-content" class="w-full space-y-2">
                <button onclick="irAlBazar()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 text-black font-black text-[9px] uppercase tracking-widest py-3.5 px-4 rounded-xl shadow-lg shadow-yellow-500/20 active:scale-95 transition-all">
                    Ir al Bazar
                </button>
                <button onclick="cerrarModalAnuncio()" class="w-full bg-white/5 text-[9px] font-black tracking-widest py-3 rounded-xl text-white/40 uppercase">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <header class="glass-header flex items-center justify-between px-4 z-50">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='index.html'" class="text-white/60 hover:text-yellow-500 text-sm p-1">◀</button>
            <img id="ia-img" src="https://i.ibb.co/7C3982b/default.jpg" class="w-9 h-9 rounded-full object-cover border border-yellow-500/30">
            <div>
                <h1 id="ia-name" class="font-black text-[11px] tracking-widest text-white uppercase">Cargando...</h1>
                <div class="flex items-center gap-2 mt-1">
                    <div class="barra-afinidad">
                        <div id="afinidad-bar" class="barra-fill"></div>
                    </div>
                    <span class="text-[7px] text-yellow-500 uppercase font-black tracking-wider">Afinidad</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <div class="bg-white/5 px-2.5 py-1 rounded-md border border-white/10 flex items-center">
                <span class="text-[8px] text-white/60 uppercase font-bold" id="free-msg-counter">0 Libres</span>
            </div>
            <div class="bg-gradient-to-tr from-yellow-500/20 to-amber-500/10 px-2.5 py-1 rounded-md border border-yellow-500/20 flex items-center">
                <span class="text-[8px] text-yellow-500 font-black tracking-wide" id="coin-counter">💎 0</span>
            </div>
        </div>
    </header>

    <div id="chat-box" class="chat-container pt-4 pb-28 px-3 flex flex-col gap-2"></div>

    <div id="typing" class="hidden fixed bottom-24 left-4 z-40 bg-black/60 backdrop-blur-md border border-white/10 rounded-xl px-3 py-1.5 flex items-center gap-1.5 shadow-xl animate-fadeIn">
        <div class="w-1.5 h-1.5 bg-yellow-500 rounded-full animate-bounce"></div>
        <div class="w-1.5 h-1.5 bg-yellow-500 rounded-full animate-bounce [animation-delay:0.2s]"></div>
        <div class="w-1.5 h-1.5 bg-yellow-500 rounded-full animate-bounce [animation-delay:0.4s]"></div>
        <span class="text-[8px] text-white/80 font-black tracking-widest uppercase ml-1">Sincronizando...</span>
    </div>

    <div id="gift-menu" class="hidden fixed bottom-[84px] inset-x-4 z-[90] glass-premium p-4 rounded-[2rem] border border-white/10 shadow-2xl animate-card">
        <div class="grid grid-cols-3 gap-3">
            <button onclick="enviarRegalo('Rosa', '🌹', 10)" class="p-3 bg-black/40 rounded-2xl flex flex-col items-center border border-white/5 active:scale-95 transition-all">
                <span class="text-xl mb-1">🌹</span>
                <span class="text-[8px] font-black uppercase text-white">Rosa</span>
                <span class="text-[8px] text-yellow-500 font-bold mt-0.5">10 💎</span>
            </button>
            <button onclick="enviarRegalo('Anillo', '💍', 50)" class="p-3 bg-black/40 rounded-2xl flex flex-col items-center border border-white/5 active:scale-95 transition-all">
                <span class="text-xl mb-1">💍</span>
                <span class="text-[8px] font-black uppercase text-white">Anillo</span>
                <span class="text-[8px] text-yellow-500 font-bold mt-0.5">50 💎</span>
            </button>
            <button onclick="enviarRegalo('Yate', '🛥️', 200)" class="p-3 bg-black/40 rounded-2xl flex flex-col items-center border border-white/5 active:scale-95 transition-all">
                <span class="text-xl mb-1">🛥️</span>
                <span class="text-[8px] font-black uppercase text-white">Yate</span>
                <span class="text-[8px] text-yellow-500 font-bold mt-0.5">200 💎</span>
            </button>
        </div>
        <button onclick="toggleRegalos()" class="w-full mt-3 bg-white/5 py-2 rounded-xl text-[8px] font-black text-white/50 tracking-widest uppercase">Regresar</button>
    </div>

    <div class="fixed bottom-0 inset-x-0 bg-black/80 backdrop-blur-md border-t border-white/5 p-4 z-40 flex items-center gap-3 pb-6">
        <button onclick="toggleRegalos()" class="bg-gradient-to-tr from-yellow-500 to-amber-600 p-3 rounded-xl flex items-center justify-center text-sm shadow-xl active:scale-95 transition-all flex-shrink-0">
            🎁
        </button>
        <div class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 flex items-center justify-between gap-2 focus-within:border-yellow-500/40 transition-all">
            <input type="text" id="msg-input" placeholder="Envía un pensamiento..." class="flex-1 bg-transparent text-xs text-white outline-none placeholder:text-white/20 italic">
            <button onclick="enviarMensaje()" class="text-yellow-500 text-xs font-black tracking-widest active:scale-95 transition-all uppercase pl-2">➤</button>
        </div>
    </div>

</body>
</html>
