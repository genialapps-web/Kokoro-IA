<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sincronía | Kokoro AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, limit, updateDoc, increment, setDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSQw7b4_OJpxZRP8Tu9shvpB4nE-xwmQc",
            authDomain: "smm-proyecto.firebaseapp.com",
            projectId: "smm-proyecto",
            storageBucket: "smm-proyecto.firebasestorage.app",
            messagingSenderId: "696404417299",
            appId: "1:696404417299:web:1c3982babc049a18f398e6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const OPENAI_KEY = ""; // Llave removida por seguridad

        // Función para obtener la API Key dinámica desde Firebase de forma segura
        async function getOpenAiKey() {
            try {
                const docSnap = await getDoc(doc(db, "config", "openai"));
                if (docSnap.exists() && docSnap.data().key) {
                    return docSnap.data().key;
                }
            } catch (e) {
                console.error("Error al obtener la API Key de Firebase", e);
            }
            return OPENAI_KEY;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const characterId = urlParams.get('id');

        let userUID = null;
        let personajeData = null;
        let unsubscribeChat = null;
        let unsubscribeUser = null;
        let isTyping = false;

        onAuthStateChanged(auth, async (user) => {
            if (user) { 
                userUID = user.uid; 
                await inicializarUsuarioSiNoExiste(user);
                cargarPersonaje();
                escucharAfinidad(); 
                escucharDatosUsuario();
            } else {
                window.location.href = 'auth.html';
            }
        });

        async function inicializarUsuarioSiNoExiste(user) {
            const userRef = doc(db, "usuarios", user.uid);
            const userSnap = await getDoc(constRef);
            if (!userSnap.exists()) {
                await setDoc(constRef, {
                    uid: user.uid,
                    isAnonymous: user.isAnonymous,
                    createdAt: new Date(),
                    freeMessages: 5, // Asignamos las 5 oportunidades iniciales
                    coins: 0,
                    isPremium: false,
                    chats: []
                });
            }
        }

        // Escucha en tiempo real el documento del usuario para mostrar los contadores
        function escucharDatosUsuario() {
            if (!userUID) return;
            if (unsubscribeUser) unsubscribeUser();

            unsubscribeUser = onSnapshot(doc(db, "usuarios", userUID), (docSnap) => {
                if (docSnap.exists()) {
                    const uData = docSnap.data();
                    const freeMsgCounter = document.getElementById('free-msg-counter');
                    const coinCounter = document.getElementById('coin-counter');

                    if (uData.isPremium) {
                        freeMsgCounter.innerText = "∞";
                        coinCounter.innerText = "💎 ∞";
                    } else {
                        freeMsgCounter.innerText = (uData.freeMessages || 0) + " Libres";
                        coinCounter.innerText = "💎 " + (uData.coins || 0);
                    }
                }
            });
        }

        async function cargarPersonaje() {
            if (!characterId) return;
            const docRef = doc(db, "personajes", characterId);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                personajeData = docSnap.data();
                document.getElementById('ia-name').innerText = personajeData.name;
                document.getElementById('ia-img').src = personajeData.image;
                
                const chatBox = document.getElementById('chat-box');
                constBox.style.backgroundImage = `linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.8)), url('${personajeData.image}')`;
                escucharMensajes();
            }
        }

        function escucharAfinidad() {
            if (!userUID || !characterId) return;
            onSnapshot(doc(db, "usuarios", userUID, "chats", characterId), (doc) => {
                if (doc.exists()) {
                    const afinidad = doc.data().afinidad || 0;
                    document.getElementById('afinidad-bar').style.width = Math.min(afinidad, 100) + "%";
                }
            });
        }

        function escucharMensajes() {
            if (!userUID || !characterId) return;
            if (unsubscribeChat) unsubscribeChat();

            const q = query(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), orderBy("createdAt", "asc"), limit(50));
            
            unsubscribeChat = onSnapshot(q, (snapshot) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snapshot.forEach(doc => { 
                    const data = doc.data();
                    if(data.createdAt) {
                        box.innerHTML += generarHTMLMensaje(data); 
                    }
                });
                box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
            });
        }

        function generarHTMLMensaje(m) {
            const isUser = m.role === 'user';
            const isGift = m.type === 'gift';
            
            if (isGift) {
                return `
                <div class="flex justify-center my-3 animate-fadeIn">
                    <div class="bg-gradient-to-tr from-yellow-400 to-amber-600 p-[1px] rounded-xl shadow-lg shadow-yellow-500/20">
                        <div class="bg-black/80 backdrop-blur-xl px-3 py-2 rounded-xl text-center">
                            <span class="text-2xl block mb-0.5">${m.icon}</span>
                            <p class="text-[7px] font-black uppercase tracking-tighter text-yellow-500">Regalaste ${m.content}</p>
                        </div>
                    </div>
                </div>`;
            }

            if (m.type === 'image') {
                return `
                <div class="flex justify-start mb-2 animate-fadeIn px-2">
                    <div class="bg-white/10 p-1 rounded-lg border border-white/10 backdrop-blur-md shadow-md max-w-[75%]">
                        <img src="${m.content}" class="rounded-md w-full h-auto object-cover border border-white/5 shadow-2xl">
                        <p class="text-[7px] text-yellow-500 font-bold uppercase mt-1 text-center tracking-widest">Foto generada (100💎)</p>
                    </div>
                </div>`;
            }

            return `
                <div class="flex ${isUser ? 'justify-end' : 'justify-start'} mb-2 animate-fadeIn px-2">
                    <div class="relative ${isUser ? 'bg-blue-600 text-white rounded-lg rounded-tr-sm' : 'bg-white/10 text-white backdrop-blur-md border border-white/10 rounded-lg rounded-tl-sm'} px-2.5 py-1.5 max-w-[75%] shadow-md">
                        <p class="text-[12px] leading-snug">${m.content}</p>
                    </div>
                </div>`;
        }

        // Lógica validada de envío de mensajes
        window.enviarMensaje = async () => {
            if (isTyping) return;

            const userRef = doc(db, "usuarios", userUID);
            const userSnap = await getDoc(userRef);

            // Si por alguna razón el usuario no se ha registrado en la base de datos, lo creamos al instante
            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    createdAt: new Date(),
                    freeMessages: 5,
                    coins: 0,
                    isPremium: false
                });
            }

            const uSnapUpdated = await getDoc(userRef);
            const uData = uSnapUpdated.data();

            if (!uData.isPremium) {
                const freeMsgs = uData.freeMessages || 0;
                const coins = uData.coins || 0;

                // Solo abre el modal si el balance está en cero y no es premium
                if (freeMsgs === 0 && coins === 0) {
                    window.mostrarModalAnuncio();
                    return;
                }
            }

            const input = document.getElementById('msg-input');
            const msg = input.value.trim();
            if (!msg || !userUID || !characterId) return;

            try {
                // Usamos transacciones atómicas de Firestore para evitar condiciones de carrera
                await runTransaction(db, async (transaction) => {
                    const transUserSnap = await transaction.get(userRef);
                    if (!transUserSnap.exists()) {
                        throw new Error("Usuario no encontrado en la base de datos.");
                    }

                    const transUserData = transUserSnap.data();

                    if (!transUserData.isPremium) {
                        const transFreeMsgs = transUserData.freeMessages || 0;
                        const transCoins = transUserData.coins || 0;

                        if (transFreeMsgs > 0) {
                            transaction.update(userRef, { freeMessages: transFreeMsgs - 1 });
                        } else if (transCoins >= 1) {
                            transaction.update(userRef, { coins: transCoins - 1 });
                        } else {
                            throw new Error("¡No tienes mensajes gratuitos ni diamantes! Por favor, recarga energía en el Bazar.");
                        }
                    }
                });
            } catch (error) {
                alert(error.message);
                return;
            }

            input.value = '';

            try {
                const msgPath = collection(db, "usuarios", userUID, "chats", characterId, "mensajes");
                await addDoc(msgPath, { role: 'user', content: msg, createdAt: new Date() });
                procesarRespuestaIA(msg);
            } catch (e) { console.error(e); }
        };

        // Funciones de control de la Publicidad y Bazar
        window.mostrarModalAnuncio = () => {
            document.getElementById('ad-modal').classList.remove('hidden');
        };

        window.cerrarModalAnuncio = () => {
            document.getElementById('ad-modal').classList.add('hidden');
        };

        // Redirección al bazar
        window.irAlBazar = () => {
            window.location.href = 'bazar.html'; 
        };

        async function procesarRespuestaIA(userContent) {
            isTyping = true;
            document.getElementById('typing').classList.remove('hidden');

            try {
                const currentApiKey = await getOpenAiKey();

                // 1. ANALIZAR EL MOOD
                const moodResponse = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${currentApiKey}` },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: "Analiza el sentimiento del usuario. Responde SOLO: CARIÑOSO, GROSERO o NEUTRAL." },
                            { role: "user", content: userContent }
                        ]
                    })
                });
                const moodData = await moodResponse.json();
                const mood = moodData.choices[0].message.content;

                let moodPrompt = "";
                if (mood.includes("GROSERO")) moodPrompt = "Estás molesta, responde de forma fría y cortante.";
                if (mood.includes("CARIÑOSO")) moodPrompt = "Estás muy feliz y afectuosa, usa muchos emojis de corazón.";

                // 2. GENERAR RESPUESTA DE TEXTO
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${currentApiKey}` },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { 
                                role: "system", 
                                content: `Eres ${personajeData.name}. Descripción: ${personajeData.description}. Personalidad: ${personajeData.personalidad}. ${moodPrompt} Responde en español, breve y coqueta. REGLA CRÍTICA: Si el usuario te pide una foto o qué haces, responde con emoción y termina con la etiqueta: [GENERA_IMAGEN: pose o acción que estás haciendo].` 
                            },
                            { role: "user", content: userContent }
                        ]
                    })
                });

                const data = await response.json();
                let aiReply = data.choices[0].message.content;
                
                // 3. INTERCEPTAR GENERACIÓN DE IMAGEN
                if (aiReply.includes("[GENERA_IMAGEN:")) {
                    const accionVisual = aiReply.match(/\[GENERA_IMAGEN: (.*?)\]/)[1];
                    aiReply = aiReply.replace(/\[GENERA_IMAGEN:.*?\]/, ""); 
                    await generarImagenIA(accionVisual);
                }

                await addDoc(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), { 
                    role: 'assistant', content: aiReply, createdAt: new Date() 
                });

                await setDoc(doc(db, "usuarios", userUID, "chats", characterId), { afinidad: increment(1), lastUpdate: new Date() }, { merge: true });

            } catch (e) { console.error(e); } finally {
                isTyping = false;
                document.getElementById('typing').classList.add('hidden');
            }
        }

        async function generarImagenIA(accionPrompt) {
            const costo = 100;
            const userRef = doc(db, "usuarios", userUID);
            const userSnap = await getDoc(userRef);
            
            if ((userSnap.data().coins || 0) < costo) {
                await addDoc(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), { 
                    role: 'assistant', content: "Cariño, me encantaría mandarte una foto pero no tienes suficientes diamantes (necesitas 100). ✨", createdAt: new Date() 
                });
                return;
            }

            try {
                await updateDoc(userRef, { coins: increment(-costo) });
                const currentApiKey = await getOpenAiKey();
                const masterLook = personajeData.physicalPrompt || "Anime girl, high quality";

                const imgResponse = await fetch("https://api.openai.com/v1/images/generations", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${currentApiKey}` },
                    body: JSON.stringify({
                        model: "dall-e-3",
                        prompt: `Masterpiece, high quality anime style art. FULL BODY shot of a character with this EXACT appearance: ${masterLook}. Situation: ${accionPrompt}. Cinematic lighting, vibrant colors, detailed background.`,
                        n: 1,
                        size: "1024x1792"
                    })
                });

                const imgData = await imgResponse.json();
                const url = imgData.data[0].url;

                await addDoc(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), { 
                    role: 'assistant', type: 'image', content: url, createdAt: new Date() 
                });
            } catch (err) { console.error(err); }
        }

        window.enviarRegalo = async (nombre, icon, costo) => {
            if (!userUID) return;
            const userRef = doc(db, "usuarios", userUID);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    createdAt: new Date(),
                    freeMessages: 5,
                    coins: 0,
                    isPremium: false
                });
            }

            const updatedSnap = await getDoc(userRef);

            // Validar si el balance es cero antes de restringir por publicidad
            if (updatedSnap.exists()) {
                const uData = updatedSnap.data();
                const isPremium = uData.isPremium;

                if (!isPremium) {
                    const freeMsgs = uData.freeMessages || 0;
                    const coins = uData.coins || 0;

                    if (freeMsgs === 0 && coins === 0) {
                        window.mostrarModalAnuncio();
                        return;
                    }
                }
            }

            if((updatedSnap.data().coins || 0) < costo) return alert("Diamantes insuficientes");

            await updateDoc(userRef, { coins: increment(-costo) });
            await addDoc(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), { 
                role: 'user', type: 'gift', icon: icon, content: nombre, createdAt: new Date() 
            });

            toggleRegalos();
            procesarRespuestaIA(`[REGALO: ${nombre} ${icon}]`);
        };

        window.toggleRegalos = () => document.getElementById('gift-menu').classList.toggle('hidden');
    </script>

<body class="text-xs">
    
    <div id="ad-modal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-xl z-[200] flex flex-col justify-center items-center p-6 text-center">
        <div class="max-w-xs w-full flex flex-col items-center">
            <div class="bg-gradient-to-tr from-yellow-500 to-amber-600 p-[1px] rounded-full mb-4">
                <div class="bg-black p-3.5 rounded-full">
                    <span class="text-xl">📺</span>
                </div>
            </div>
            <h3 class="text-[11px] font-black text-yellow-500 uppercase tracking-widest mb-1.5">Espacio Publicitario</h3>
            <p class="text-[9px] text-white/50 max-w-[230px] mx-auto mb-6 leading-relaxed">
                Ve al Bazar y presiona "Obtener" en los 5 Mensajes Gratis para seguir con el chat.
            </p>
            
            <div id="ad-content" class="w-full">
                <button onclick="irAlBazar()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 text-black font-black text-[9px] uppercase tracking-widest py-3.5 px-4 rounded-xl shadow-xl shadow-yellow-500/10 active:scale-95 transition-all">
                    Ir al Bazar
                </button>
                <button onclick="cerrarModalAnuncio()" class="w-full mt-3.5 bg-white/5 text-[9px] font-black tracking-widest py-3 rounded-xl hover:bg-white/10 active:scale-95 transition-all text-white/50 uppercase">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <header class="glass-header flex items-center justify-between px-4 z-50">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='index.html'" class="text-white/60 hover:text-yellow-500 transition">◀</button>
            <img id="ia-img" src="https://i.ibb.co/7C3982b/default.jpg" class="w-8 h-8 rounded-full object-cover border border-yellow-500/20">
            <div>
                <h1 id="ia-name" class="font-black text-[10px] tracking-widest text-white uppercase">Cargando...</h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <div class="barra-afinidad">
                        <div id="afinidad-bar" class="barra-fill"></div>
                    </div>
                    <span class="text-[8px] text-yellow-500 uppercase font-bold tracking-wider">Afinidad</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <div class="bg-white/5 px-2 py-1 rounded-md border border-white/10 flex items-center gap-1.5">
                <span class="text-[8px] text-white/50 uppercase font-bold" id="free-msg-counter">0 Libres</span>
            </div>
            <div class="bg-gradient-to-tr from-yellow-500/20 to-amber-500/10 px-2 py-1 rounded-md border border-yellow-500/20 flex items-center gap-1.5">
                <span class="text-[8px] text-yellow-500 font-black tracking-wide" id="coin-counter">💎 0</span>
            </div>
        </div>
    </header>

    <div id="chat-box" class="chat-container pt-4 pb-32 px-2 flex flex-col gap-2">
        </div>

    <div id="typing" class="hidden fixed bottom-32 left-4 z-40 bg-white/10 backdrop-blur-md border border-white/10 rounded-xl px-4 py-2 flex items-center gap-2 shadow-xl animate-fadeIn">
        <div class="w-2 h-2 bg-yellow-500 rounded-full animate-bounce"></div>
        <div class="w-2 h-2 bg-yellow-500 rounded-full animate-bounce delay-100"></div>
        <div class="w-2 h-2 bg-yellow-500 rounded-full animate-bounce delay-200"></div>
        <span class="text-[9px] text-white font-bold tracking-widest uppercase ml-1">Escribiendo...</span>
    </div>

    <div id="gift-menu" class="hidden fixed bottom-[92px] inset-x-4 z-[90] glass-premium p-4 rounded-[2rem] border border-white/10 shadow-2xl animate-fadeIn">
        <div class="grid grid-cols-3 gap-3">
            <button onclick="enviarRegalo('Rosa', '🌹', 10)" class="gift-card p-3 rounded-2xl flex flex-col items-center border border-white/5">
                <span class="text-xl mb-1">🌹</span>
                <span class="text-[8px] font-black uppercase text-white">Rosa</span>
                <span class="text-[8px] text-yellow-500 font-bold mt-0.5">10 💎</span>
            </button>
            <button onclick="enviarRegalo('Anillo', '💍', 50)" class="gift-card p-3 rounded-2xl flex flex-col items-center border border-white/5">
                <span class="text-xl mb-1">💍</span>
                <span class="text-[8px] font-black uppercase text-white">Anillo</span>
                <span class="text-[8px] text-yellow-500 font-bold mt-0.5">50 💎</span>
            </button>
            <button onclick="enviarRegalo('Yate', '🛥️', 200)" class="gift-card p-3 rounded-2xl flex flex-col items-center border border-white/5">
                <span class="text-xl mb-1">🛥️</span>
                <span class="text-[8px] font-black uppercase text-white">Yate</span>
                <span class="text-[8px] text-yellow-500 font-bold mt-0.5">200 💎</span>
            </button>
        </div>
        <button onclick="toggleRegalos()" class="w-full mt-3 bg-white/5 py-2 rounded-xl text-[7px] font-black text-white/60 tracking-widest uppercase border border-white/5">Cerrar</button>
    </div>

    <div class="fixed bottom-0 inset-x-0 bg-black/60 backdrop-blur-xl border-t border-white/5 p-4 z-40 flex items-center gap-3 pb-8 md:pb-6">
        <button onclick="toggleRegalos()" class="bg-gradient-to-tr from-yellow-500 to-amber-600 p-3.5 rounded-2xl flex items-center justify-center text-sm shadow-xl shadow-yellow-500/10 active:scale-95 transition-all flex-shrink-0">
            🎁
        </button>
        <div class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-4 py-3 flex items-center justify-between gap-2">
            <input type="text" id="msg-input" placeholder="Escribe un mensaje..." class="flex-1 bg-transparent text-xs text-white outline-none placeholder:text-white/30">
            <button onclick="enviarMensaje()" class="text-yellow-500 text-sm font-bold active:scale-95 transition-all">➤</button>
        </div>
    </div>

</body>
</html>
