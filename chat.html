<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sincronía | Kokoro AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, limit, updateDoc, increment, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSQw7b4_OJpxZRP8Tu9shvpB4nE-xwmQc",
            authDomain: "smm-proyecto.firebaseapp.com",
            projectId: "smm-proyecto",
            storageBucket: "smm-proyecto.firebasestorage.app",
            messagingSenderId: "696404417299",
            appId: "1:696404417299:web:1c3982babc049a18f398e6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const OPENAI_KEY = ""; // Llave removida por seguridad

        // Función para obtener la API Key dinámica desde Firebase de forma segura
        async function getOpenAiKey() {
            try {
                const docSnap = await getDoc(doc(db, "config", "openai"));
                if (docSnap.exists() && docSnap.data().key) {
                    return docSnap.data().key;
                }
            } catch (e) {
                console.error("Error al obtener la API Key de Firebase", e);
            }
            return OPENAI_KEY;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const characterId = urlParams.get('id');

        let userUID = null;
        let personajeData = null;
        let unsubscribeChat = null;
        let isTyping = false;

        onAuthStateChanged(auth, (user) => {
            if (user) { 
                userUID = user.uid; 
                cargarPersonaje();
                escucharAfinidad(); 
            } else {
                window.location.href = 'auth.html';
            }
        });

        async function cargarPersonaje() {
            if (!characterId) return;
            const docRef = doc(db, "personajes", characterId);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                personajeData = docSnap.data();
                document.getElementById('ia-name').innerText = personajeData.name;
                document.getElementById('ia-img').src = personajeData.image;
                
                const chatBox = document.getElementById('chat-box');
                chatBox.style.backgroundImage = `linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.8)), url('${personajeData.image}')`;
                escucharMensajes();
            }
        }

        function escucharAfinidad() {
            if (!userUID || !characterId) return;
            onSnapshot(doc(db, "usuarios", userUID, "chats", characterId), (doc) => {
                if (doc.exists()) {
                    const afinidad = doc.data().afinidad || 0;
                    document.getElementById('afinidad-bar').style.width = Math.min(afinidad, 100) + "%";
                }
            });
        }

        function escucharMensajes() {
            if (!userUID || !characterId) return;
            if (unsubscribeChat) unsubscribeChat();

            const q = query(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), orderBy("createdAt", "asc"), limit(50));
            
            unsubscribeChat = onSnapshot(q, (snapshot) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snapshot.forEach(doc => { 
                    const data = doc.data();
                    if(data.createdAt) {
                        box.innerHTML += generarHTMLMensaje(data); 
                    }
                });
                box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
            });
        }

        function generarHTMLMensaje(m) {
            const isUser = m.role === 'user';
            const isGift = m.type === 'gift';
            
            if (isGift) {
                return `
                <div class="flex justify-center my-6 animate-fadeIn">
                    <div class="bg-gradient-to-tr from-yellow-400 to-amber-600 p-[1px] rounded-3xl shadow-lg shadow-yellow-500/20">
                        <div class="bg-black/80 backdrop-blur-xl px-6 py-4 rounded-3xl text-center">
                            <span class="text-4xl block mb-2">${m.icon}</span>
                            <p class="text-[9px] font-black uppercase tracking-tighter text-yellow-500">Regalaste ${m.content}</p>
                        </div>
                    </div>
                </div>`;
            }

            if (m.type === 'image') {
                return `
                <div class="flex justify-start mb-3 animate-fadeIn px-2">
                    <div class="bg-white/10 p-2 rounded-2xl border border-white/10 backdrop-blur-md shadow-md max-w-[85%]">
                        <img src="${m.content}" class="rounded-xl w-full h-auto object-cover border border-white/5 shadow-2xl">
                        <p class="text-[9px] text-yellow-500 font-bold uppercase mt-2 text-center tracking-widest">Foto generada (100💎)</p>
                    </div>
                </div>`;
            }

            return `
                <div class="flex ${isUser ? 'justify-end' : 'justify-start'} mb-3 animate-fadeIn px-2">
                    <div class="relative ${isUser ? 'bg-blue-600 text-white rounded-2xl rounded-tr-sm' : 'bg-white/10 text-white backdrop-blur-md border border-white/10 rounded-2xl rounded-tl-sm'} px-4 py-2.5 max-w-[85%] shadow-md">
                        <p class="text-[15px] leading-snug">${m.content}</p>
                    </div>
                </div>`;
        }

        window.enviarMensaje = async () => {
            if (isTyping) return;
            const input = document.getElementById('msg-input');
            const msg = input.value.trim();
            if (!msg || !userUID || !characterId) return;

            // --- LÓGICA DE VERIFICACIÓN DE MENSAJES Y ENERGÍA ---
            const userRef = doc(db, "usuarios", userUID);
            const userSnap = await getDoc(userRef);
            
            if (userSnap.exists()) {
                const uData = userSnap.data();
                
                if (!uData.isPremium) {
                    const freeMsgs = uData.freeMessages || 0;
                    const coins = uData.coins || 0;
                    
                    if (freeMsgs > 0) {
                        // Si hay mensajes gratis, restamos 1 del contador de mensajes gratuitos
                        await updateDoc(userRef, { freeMessages: increment(-1) });
                    } else if (coins >= 1) {
                        // Si no hay mensajes gratis pero hay diamantes, restamos 1 diamante
                        await updateDoc(userRef, { coins: increment(-1) });
                    } else {
                        alert("¡No tienes mensajes gratuitos ni diamantes! Por favor, recarga energía en el Bazar.");
                        return; // Se detiene el envío
                    }
                }
            }
            
            input.value = '';
            try {
                const msgPath = collection(db, "usuarios", userUID, "chats", characterId, "mensajes");
                await addDoc(msgPath, { role: 'user', content: msg, createdAt: new Date() });
                procesarRespuestaIA(msg);
            } catch (e) { console.error(e); }
        };

        async function procesarRespuestaIA(userContent) {
            isTyping = true;
            document.getElementById('typing').classList.remove('hidden');

            try {
                const currentApiKey = await getOpenAiKey();

                // 1. ANALIZAR EL MOOD
                const moodResponse = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${currentApiKey}` },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: "Analiza el sentimiento del usuario. Responde SOLO: CARIÑOSO, GROSERO o NEUTRAL." },
                            { role: "user", content: userContent }
                        ]
                    })
                });
                const moodData = await moodResponse.json();
                const mood = moodData.choices[0].message.content;

                let moodPrompt = "";
                if (mood.includes("GROSERO")) moodPrompt = "Estás molesta, responde de forma fría y cortante.";
                if (mood.includes("CARIÑOSO")) moodPrompt = "Estás muy feliz y afectuosa, usa muchos emojis de corazón.";

                // 2. GENERAR RESPUESTA DE TEXTO
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${currentApiKey}` },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { 
                                role: "system", 
                                content: `Eres ${personajeData.name}. Descripción: ${personajeData.description}. Personalidad: ${personajeData.personalidad}. ${moodPrompt} Responde en español, breve y coqueta. REGLA CRÍTICA: Si el usuario te pide una foto o qué haces, responde con emoción y termina con la etiqueta: [GENERA_IMAGEN: pose o acción que estás haciendo].` 
                            },
                            { role: "user", content: userContent }
                        ]
                    })
                });

                const data = await response.json();
                let aiReply = data.choices[0].message.content;
                
                // 3. INTERCEPTAR GENERACIÓN DE IMAGEN
                if (aiReply.includes("[GENERA_IMAGEN:")) {
                    const accionVisual = aiReply.match(/\[GENERA_IMAGEN: (.*?)\]/)[1];
                    aiReply = aiReply.replace(/\[GENERA_IMAGEN:.*?\]/, ""); 
                    await generarImagenIA(accionVisual);
                }

                await addDoc(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), { 
                    role: 'assistant', content: aiReply, createdAt: new Date() 
                });

                await setDoc(doc(db, "usuarios", userUID, "chats", characterId), { afinidad: increment(1), lastUpdate: new Date() }, { merge: true });

            } catch (e) { console.error(e); } finally {
                isTyping = false;
                document.getElementById('typing').classList.add('hidden');
            }
        }

        async function generarImagenIA(accionPrompt) {
            const costo = 100;
            const userRef = doc(db, "usuarios", userUID);
            const userSnap = await getDoc(userRef);
            
            if ((userSnap.data().coins || 0) < costo) {
                await addDoc(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), { 
                    role: 'assistant', content: "Cariño, me encantaría mandarte una foto pero no tienes suficientes diamantes (necesitas 100). ✨", createdAt: new Date() 
                });
                return;
            }

            try {
                // Descontar diamantes primero
                await updateDoc(userRef, { coins: increment(-costo) });

                const currentApiKey = await getOpenAiKey();

                // Obtener prompt de apariencia del Admin
                const masterLook = personajeData.physicalPrompt || "Anime girl, high quality";

                const imgResponse = await fetch("https://api.openai.com/v1/images/generations", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${currentApiKey}` },
                    body: JSON.stringify({
                        model: "dall-e-3",
                        prompt: `Masterpiece, high quality anime style art. FULL BODY shot of a character with this EXACT appearance: ${masterLook}. Situation: ${accionPrompt}. Cinematic lighting, vibrant colors, detailed background.`,
                        n: 1,
                        size: "1024x1792" // Formato vertical cuerpo completo
                    })
                });

                const imgData = await imgResponse.json();
                const url = imgData.data[0].url;

                await addDoc(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), { 
                    role: 'assistant', type: 'image', content: url, createdAt: new Date() 
                });

            } catch (err) { console.error(err); }
        }

        window.enviarRegalo = async (nombre, icon, costo) => {
            if (!userUID) return;
            const userRef = doc(db, "usuarios", userUID);
            const userSnap = await getDoc(userRef);
            if((userSnap.data().coins || 0) < costo) return alert("Diamantes insuficientes");

            await updateDoc(userRef, { coins: increment(-costo) });
            await addDoc(collection(db, "usuarios", userUID, "chats", characterId, "mensajes"), { 
                role: 'user', type: 'gift', icon: icon, content: nombre, createdAt: new Date() 
            });
            toggleRegalos();
            procesarRespuestaIA(`[REGALO: ${nombre} ${icon}]`);
        };

        window.toggleRegalos = () => document.getElementById('gift-menu').classList.toggle('hidden');
    </script>
    
    <style>
        body { background: #000; color: white; font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; overflow: hidden; }
        .glass-header { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .chat-container { height: calc(100vh - 160px); overflow-y: auto; background-size: cover; background-position: center; transition: all 0.5s ease; }
        .barra-afinidad { height: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; width: 80px; overflow: hidden; }
        .barra-fill { height: 100%; background: linear-gradient(90deg, #eab308, #f59e0b); width: 0%; transition: width 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        ::-webkit-scrollbar { display: none; }
        .gift-card { background: rgba(255,255,255,0.05); transition: transform 0.2s; }
        .gift-card:active { transform: scale(0.9); }
    </style>
</head>
<body class="flex flex-col">
    
    <header class="glass-header p-4 flex justify-between items-center z-50">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='index.html'" class="text-white/70 text-2xl pr-2">❮</button>
            <div class="relative">
                <img id="ia-img" src="" class="w-11 h-11 rounded-full object-cover border-2 border-white/20">
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-black rounded-full"></div>
            </div>
            <div>
                <h2 id="ia-name" class="text-[15px] font-extrabold text-white leading-none">...</h2>
                <div class="flex items-center gap-2 mt-1.5">
                    <span class="text-[9px] font-bold text-yellow-500 uppercase tracking-widest">Afinidad</span>
                    <div class="barra-afinidad"><div id="afinidad-bar" class="barra-fill"></div></div>
                </div>
            </div>
        </div>
        <button onclick="toggleRegalos()" class="bg-white/10 p-2.5 rounded-full active:scale-90 transition">🎁</button>
    </header>

    <div id="gift-menu" class="hidden absolute bottom-28 left-4 right-4 bg-slate-900/95 backdrop-blur-3xl p-6 rounded-[2.5rem] z-[100] border border-white/10 shadow-2xl">
        <h3 class="text-center text-[10px] font-black tracking-[0.2em] text-white/40 mb-6 uppercase">Enviar un detalle</h3>
        <div class="grid grid-cols-3 gap-4">
            <div onclick="enviarRegalo('Corazón', '❤️', 10)" class="gift-card p-4 rounded-3xl text-center">
                <span class="text-2xl">❤️</span><p class="text-[10px] font-bold mt-1 text-yellow-500">10</p>
            </div>
            <div onclick="enviarRegalo('Bebida', '🍹', 30)" class="gift-card p-4 rounded-3xl text-center">
                <span class="text-2xl">🍹</span><p class="text-[10px] font-bold mt-1 text-yellow-500">30</p>
            </div>
            <div onclick="enviarRegalo('Rosa', '🌹', 50)" class="gift-card p-4 rounded-3xl text-center">
                <span class="text-2xl">🌹</span><p class="text-[10px] font-bold mt-1 text-yellow-500">50</p>
            </div>
            <div onclick="enviarRegalo('Peluche', '🧸', 150)" class="gift-card p-4 rounded-3xl text-center">
                <span class="text-2xl">🧸</span><p class="text-[10px] font-bold mt-1 text-yellow-500">150</p>
            </div>
            <div onclick="enviarRegalo('Anillo', '💍', 300)" class="gift-card p-4 rounded-3xl text-center">
                <span class="text-2xl">💍</span><p class="text-[10px] font-bold mt-1 text-yellow-500">300</p>
            </div>
            <div onclick="enviarRegalo('Diamante', '💎', 500)" class="gift-card p-4 rounded-3xl text-center">
                <span class="text-2xl">💎</span><p class="text-[10px] font-bold mt-1 text-yellow-500">500</p>
            </div>
        </div>
        <button onclick="toggleRegalos()" class="w-full mt-6 text-[11px] font-black text-slate-500 uppercase tracking-widest">Cerrar</button>
    </div>

    <main id="chat-box" class="chat-container p-4 space-y-2 flex flex-col"></main>

    <div id="typing" class="hidden px-6 py-3 flex gap-1.5 items-center">
        <div class="flex gap-1">
            <span class="w-1.5 h-1.5 bg-white/30 rounded-full animate-bounce"></span>
            <span class="w-1.5 h-1.5 bg-white/30 rounded-full animate-bounce [animation-delay:0.2s]"></span>
            <span class="w-1.5 h-1.5 bg-white/30 rounded-full animate-bounce [animation-delay:0.4s]"></span>
        </div>
        <span class="text-[10px] font-bold text-white/20 uppercase tracking-widest ml-2">Escribiendo...</span>
    </div>

    <footer class="p-4 bg-black/80 backdrop-blur-2xl border-t border-white/5">
        <div class="flex items-center gap-3 max-w-5xl mx-auto">
            <div class="flex-1 relative">
                <input id="msg-input" type="text" placeholder="Escribe algo..." 
                    class="w-full bg-white/5 border border-white/10 p-3.5 px-6 rounded-full text-[15px] outline-none focus:border-blue-500/50 transition-all" 
                    onkeypress="if(event.key === 'Enter') enviarMensaje()">
            </div>
            <button onclick="enviarMensaje()" class="bg-blue-600 hover:bg-blue-500 text-white p-3.5 px-6 rounded-full font-bold text-sm transition-all active:scale-95 shadow-lg shadow-blue-600/20">
                Enviar
            </button>
        </div>
    </footer>

</body>
</html>
